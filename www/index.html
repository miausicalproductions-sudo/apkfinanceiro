<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Financeiro</title>
<style>
@font-face{font-family:'Inter Tight';src:url('fonts/InterTight.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--bg:#000;--card:#0e0e0e;--card2:#161616;--line:#1f1f1f;--line2:#2a2a2a;--tx:#fff;--mut:#8c8c8c;--dim:#5a5a5a;
--lima:#c5f400;--lima2:#9bc400;--verm:#ff4d4d;--azul:#3d8bff;--r:28px;
--top:calc(max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px)) + 12px);
--bot:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:500 15px/1.35 'Inter Tight',system-ui,-apple-system,Roboto,sans-serif;letter-spacing:-.01em}
body{overflow:hidden}
#app{height:100%}
main{height:100%;overflow-y:auto;padding:var(--top) 14px calc(var(--bot) + 110px);-webkit-overflow-scrolling:touch}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.14em}
svg.i.fill{fill:currentColor;stroke:none}
.title{font-size:30px;line-height:1.08;font-weight:600;letter-spacing:-.035em;margin:18px 6px 18px}
.title span{color:var(--mut)}
.lbl{font-size:13px;color:var(--mut);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.big{font-size:32px;font-weight:600;letter-spacing:-.035em;line-height:1.05}
.mut{color:var(--mut)}.lima{color:var(--lima)}.verm{color:var(--verm)}
/* hero com degradê */
.hero{position:relative;border-radius:0 0 34px 34px;margin:calc(-1 * var(--top)) -14px 14px;padding:calc(var(--top) + 6px) 20px 24px;min-height:250px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
background:radial-gradient(120% 90% at 85% 0%,#ff7a2f 0%,rgba(255,122,47,0) 55%),radial-gradient(90% 80% at 0% 10%,#6a4dff 0%,rgba(106,77,255,0) 60%),radial-gradient(100% 70% at 50% 100%,#b22a14 0%,rgba(178,42,20,0) 70%),#14091f}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55));pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .row1{display:flex;justify-content:space-between;align-items:center}
.logo{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:20px;color:var(--lima)}
.pilha{display:flex;align-items:center;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);border-radius:999px;padding:5px 10px 5px 6px}
.pilha .b{margin-right:-9px}
.pilha .dot{width:7px;height:7px;border-radius:50%;margin-left:16px;background:var(--lima)}
.pilha .dot.off{background:#ff9a3d}
.hero .big{font-size:42px}
.hero .lbl{color:rgba(255,255,255,.75)}
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--line2);background:rgba(20,20,20,.7);color:#fff;border-radius:999px;padding:9px 16px;font:inherit;font-weight:500;font-size:14px;white-space:nowrap}
.pill.on{background:#fff;color:#000;border-color:#fff}
/* banco (círculo colorido) */
.b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:17px;border:2px solid #000;flex:none}
.b.g{width:44px;height:44px;font-size:21px;border:0}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.mini .v{font-size:20px;font-weight:600;letter-spacing:-.03em;margin-top:2px}
.mini .s{font-size:12px;color:var(--mut)}
.tap:active{opacity:.6}
.mini .s svg{vertical-align:-.2em;color:var(--dim)}
.mini .cab{display:flex;align-items:center;justify-content:space-between;min-height:34px}
.cab .ch{color:var(--dim);font-size:16px}
.segbar{display:flex;gap:4px;height:6px;margin:14px 0 18px}
.segbar i{display:block;border-radius:9px;min-width:6px}
.mbar{display:flex;gap:5px;align-items:center;flex:1;margin-right:12px}
.mbar i{display:block;height:9px;border-radius:9px}
/* mapa de pontos */
.heat{display:grid;gap:6px;margin-top:14px}
.heat i{aspect-ratio:1;border-radius:5px;background:#1a1a1a;display:block}
.heat i.l1{background:#3f5200}.heat i.l2{background:#6b8a00}.heat i.l3{background:#9bc400}.heat i.l4{background:#c5f400}
/* campo rápido */
.quick{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 20px;margin-bottom:12px}
.quick input{border:0;background:none;padding:11px 0;border-radius:0;flex:1;min-width:0}
.quick .go{width:42px;height:42px;border-radius:50%;border:0;background:var(--lima);color:#000;font-size:19px;display:grid;place-items:center}
.quick .scan{background:none;border:0;color:var(--lima);font-size:23px;width:40px;height:40px;display:grid;place-items:center}
input,select{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line2);border-radius:18px;padding:14px 16px;font:inherit;outline:none}
input:focus,select:focus{border-color:var(--lima)}
input::placeholder{color:var(--dim)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#777 50%),linear-gradient(135deg,#777 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
.btn{border:0;border-radius:999px;padding:14px 20px;font:inherit;font-weight:600;background:var(--card2);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active,.pill:active,.row:active{opacity:.65}
.btn.pri{background:var(--lima);color:#000}.btn.bco{background:#fff;color:#000}.btn.no{background:#2a1214;color:var(--verm)}
.btn.sm{padding:8px 14px;font-size:13px}.btn.full{width:100%}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 6px 10px}
.sec h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.03em}
/* linhas */
.row{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#171717;flex:none;font-size:21px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.row .t span{font-size:12.5px;color:var(--mut)}
.row .v{font-weight:600;white-space:nowrap;font-size:16px}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.badge{background:var(--lima);color:#000;border-radius:999px;font-size:11px;font-weight:700;padding:3px 9px}
/* barras do mês */
.pares{display:flex;gap:6px;align-items:flex-end;justify-content:space-around;height:170px;margin:18px 0 6px}
.par{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;opacity:.45}
.par.on{opacity:1}
.par .bb{display:flex;gap:4px;align-items:flex-end;height:140px}
.par .bb i{display:block;width:14px;border-radius:9px;min-height:6px}
.par .e{background:linear-gradient(180deg,#b6ff2a,#2fbf2f)}.par .d{background:linear-gradient(180deg,#ff6b6b,#e03a3a)}
.par small{color:var(--mut);font-size:12px;text-transform:lowercase}
.leg{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:15px}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.prog{height:6px;background:#1c1c1c;border-radius:9px;overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;border-radius:9px;background:var(--lima)}
.prog i.over{background:var(--verm)}
/* navegação flutuante */
.dock{position:fixed;left:14px;right:14px;bottom:calc(var(--bot) + 14px);display:flex;gap:10px;align-items:center;z-index:10}
.dock nav{flex:1;display:flex;background:rgba(18,18,18,.92);border:1px solid var(--line2);border-radius:999px;padding:6px;backdrop-filter:blur(14px)}
.dock nav button{flex:1;border:0;background:none;color:var(--mut);height:50px;border-radius:999px;font-size:24px;display:grid;place-items:center}
.dock nav button.on{background:#252525;color:var(--lima)}
.fab{width:62px;height:62px;border-radius:50%;border:0;background:var(--lima);color:#000;font-size:28px;display:grid;place-items:center;box-shadow:0 10px 30px rgba(197,244,0,.25)}
/* folhas */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:93%;overflow-y:auto;background:#0b0b0b;border-radius:32px 32px 0 0;border:1px solid var(--line2);border-bottom:0;padding:10px 18px calc(var(--bot) + 20px)}
.sheet:before{content:"";display:block;width:42px;height:4px;border-radius:9px;background:#333;margin:0 auto 16px}
.sheet h3{margin:0 0 16px;font-size:24px;font-weight:600;letter-spacing:-.03em}
.f{margin-bottom:12px}.f label{display:block;font-size:12.5px;color:var(--mut);margin:0 0 6px 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card2);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:11px 0;border-radius:999px}
.seg button.on{background:#fff;color:#000}
.hint{font-size:12.5px;color:var(--mut);margin:6px 6px 14px}
.chk{display:flex;gap:10px;align-items:center;color:var(--mut);margin:6px 6px 16px;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--lima);padding:0}
.toast{position:fixed;left:14px;right:14px;top:var(--top);z-index:40;background:#161616;border:1px solid var(--line2);border-radius:22px;padding:14px 18px;box-shadow:0 14px 40px rgba(0,0,0,.6);animation:in .2s;display:flex;gap:10px;align-items:center}
.toast.good{border-color:#3f5200}.toast.good svg{color:var(--lima)}.toast.bad{border-color:#5a1f22}.toast.bad svg{color:var(--verm)}
@keyframes in{from{transform:translateY(-12px);opacity:0}}
a{color:var(--lima)}
</style>
</head>
<body>

<div id="app"><main id="main"></main>

<script>
/* ============ base ============ */
const $ = s => document.querySelector(s);
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const CATS = ['Mercado','Comida','Transporte','Casa','Lazer','Saúde','Contas','Outros'];
const PADRAO = {mercado:'Mercado',supermercado:'Mercado',feira:'Mercado',uber:'Transporte',onibus:'Transporte',gasolina:'Transporte',combustivel:'Transporte',ifood:'Comida',lanche:'Comida',almoco:'Comida',jantar:'Comida',padaria:'Comida',aluguel:'Casa',luz:'Contas',agua:'Contas',internet:'Contas',netflix:'Contas',farmacia:'Saúde',remedio:'Saúde',cinema:'Lazer',bar:'Lazer',salario:'Receita',freela:'Receita'};
// ícone e cor de cada categoria (linhas finas num círculo escuro, como no app de referência)
const CATV = {Mercado:['cart','#b6f23a'],Comida:['food','#ff8a3d'],Transporte:['car','#f5c518'],Casa:['house','#8b7cff'],Lazer:['ticket','#ff5fa2'],'Saúde':['heart','#ff5a5f'],Contas:['bill','#2fd1c5'],Outros:['dots','#9a9a9a'],Receita:['in','#c5f400'],Ajuste:['scale','#6fb3ff'],'Transferência':['swap','#6fb3ff']};
const BANCOS = ['#ff7a1a','#19c37d','#e5254b','#7c5cff','#2f8cff','#f5c518'];
const ic = (n, c) => `<svg class="i ${c || ''}"><use href="#i-${n}"/></svg>`;
const brl = v => (Number(v) || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const isoHoje = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const dt = i => String(i || '').split('-').reverse().join('/');
const uid = () => 'x' + Math.random().toString(16).slice(2, 9).padEnd(7, '0');
const norm = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const num = t => { let s = String(t).trim().replace(/^R\$\s*/i, ''); const neg = s[0] === '-'; s = s.replace(/^[-+]/, '');
  s = /^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(s) ? s.replace(/\./g, '').replace(',', '.') : s.replace(',', '.');
  const v = parseFloat(s); return isNaN(v) ? null : (neg ? -v : v); };
const S = { cfg: {url: '', chave: ''}, linhas: {}, carteiras: [], orc: [], desde: 0, fila: [], tab: 'home', mes: isoHoje().slice(0, 7), mview: 'rd', pf: '', todos: false, rede: null };

function salvarLocal() { try { localStorage.setItem('fin_state', JSON.stringify({linhas: S.linhas, carteiras: S.carteiras, orc: S.orc, desde: S.desde, fila: S.fila})); } catch (e) {} }
function carregarLocal() {
  try { const c = JSON.parse(localStorage.getItem('fin_cfg') || '{}'); S.cfg.url = c.url || ''; S.cfg.chave = c.chave || ''; } catch (e) {}
  try { const o = JSON.parse(localStorage.getItem('fin_state') || '{}'); if (o.linhas) Object.assign(S, {linhas: o.linhas, carteiras: o.carteiras || [], orc: o.orc || [], desde: o.desde || 0, fila: o.fila || []}); } catch (e) {}
}
// grava link e chave também onde o widget nativo consegue ler (Preferences do Capacitor)
async function salvarCfg() {
  try { localStorage.setItem('fin_cfg', JSON.stringify(S.cfg)); } catch (e) {}
  try { const P = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Preferences;
    if (P) { await P.set({key: 'url', value: S.cfg.url}); await P.set({key: 'chave', value: S.cfg.chave}); } } catch (e) {}
}

/* ============ rede ============ */
async function api(body) {
  if (!/^https:\/\//.test(S.cfg.url) || !S.cfg.chave) throw Object.assign(new Error('Configure o link e a chave em Ajustes.'), {cfg: true});
  let r;
  try { r = await fetch(S.cfg.url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({chave: S.cfg.chave}, body)), redirect: 'follow'}); }
  catch (e) { throw Object.assign(new Error('Sem conexão com o servidor.'), {rede: true}); }
  let j; const t = await r.text();
  try { j = JSON.parse(t); } catch (e) { throw new Error('Resposta inesperada do servidor. Confira o link e a implantação.'); }
  if (j.erro) throw new Error(j.erro);
  return j;

const L = a => ({id: String(a[0]), data: String(a[1]), tipo: a[2], valor: Number(a[3]), cat: a[4] || '', desc: a[5] || '', cart: a[6] || '', dest: a[7] || '', grupo: String(a[8] || ''),

          else {

            while (S.fila[n] && S.fila[n].k === 'ops' && lote.length < 40) { lote.push(...S.fila[n].ops); n++; }

      return `<div class="row"><div class="ico" style="color:${v[1]}">${ic(v[0])}</div><div class="t"><b>${esc(c)}</b><span>${o[c] ? p + '% de ' + brl(o[c]) : p + '% dos gastos'}</span><div class="prog"><i class="${o[c] && p > 100 ? 'over' : ''}" style="width:${Math.min(p, 100)}%"></i></div></div><div class="v">${brl(r.cat[c])}</div></div>`; }).join('') : '<div class="empty">Sem saídas neste mês.</div>'}</div>
     <button class="btn full" data-a="orc">${ic('target')} Definir orçamentos</button>`;
  } else {
    const top = Object.keys(r.dia).sort((a, b) => r.dia[b] - r.dia[a]).slice(0, 5);
    corpo = `<div class="card"><div class="lbl">Gastos em ${MESES[m - 1]}</div><div class="big" style="margin-top:4px">${brl(r.s)}</div>${mapaDias(S.mes, r.dia)}
     <div style="display:flex;gap:6px;align-items:center;margin-top:14px;font-size:12px;color:var(--mut)">menos <span class="heat" style="display:flex;gap:4px;margin:0"><i style="width:14px;aspect-ratio:1"></i><i class="l1" style="width:14px;aspect-ratio:1"></i><i class="l2" style="width:14px;aspect-ratio:1"></i><i class="l3" style="width:14px;aspect-ratio:1"></i><i class="l4" style="width:14px;aspect-ratio:1"></i></span> mais</div></div>
     <div class="card" style="padding:6px 18px">${top.length ? top.map(d => `<div class="row"><div class="ico">${ic('cal')}</div><div class="t"><b>Dia ${d}</b><span>maiores gastos do mês</span></div><div class="v">${brl(r.dia[d])}</div></div>`).join('') : '<div class="empty">Sem gastos neste mês.</div>'}</div>`;
  }
  return `<h1 class="title">Para onde foi<br><span>o seu dinheiro.</span></h1>
  <div style="display:flex;align-items:center;justify-content:space-between;margin:0 0 14px"><button class="btn sm" data-a="mm" data-d="-1" aria-label="Mês anterior">${ic('left')}</button><b style="font-size:17px;text-transform:capitalize">${MESES[m - 1]} ${y}</b><button class="btn sm" data-a="mm" data-d="1" aria-label="Próximo mês">${ic('right')}</button></div>
  <div class="pills">${[['rd', 'Rece. vs Desp.'], ['gt', 'Gastos'], ['dy', 'Dias']].map(([k, n]) => `<button class="pill ${S.mview === k ? 'on' : ''}" data-a="mv" data-v="${k}">${n}</button>`).join('')}</div>${corpo}`;
}
function telaMais() {
  const P = parcelas(), c = S.cfg;
  return `<h1 class="title">Ajustes<br><span>e conexão.</span></h1>
  <div class="sec" style="margin-top:0"><h2>Parcelamentos</h2></div>
  <div class="card">${P.length ? P.map(x => `<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between"><b style="font-size:16px">${esc(x.d)}</b><span>${x.n}x de ${brl(x.val)}</span></div>
   <div class="prog"><i style="width:${Math.round(x.pag / x.n * 100)}%"></i></div>
   <div class="mut" style="font-size:12.5px;margin-top:7px">pagas ${x.pag}/${x.n} • faltam ${x.fal} = ${brl(x.vf)} • próxima ${dt(x.prox)} • termina ${dt(x.fim)}</div>
   <button class="btn sm" style="margin-top:9px" data-a="adiantar" data-k="${esc(x.k)}">Adiantar uma parcela</button></div>`).join('') + `<b>Falta pagar: ${brl(P.reduce((a, x) => a + x.vf, 0))}</b>` : '<div class="empty">Nenhuma parcela pendente.</div>'}</div>
  <div class="sec"><h2>Contas</h2><button class="btn sm" data-a="novacart">${ic('plus')} Conta</button></div>
  <div class="card" style="padding:6px 18px">${S.carteiras.map(k => `<div class="row">${banco(k.nome, 1)}<div class="t"><b>${esc(k.nome)}</b><span>saldo inicial ${brl(k.ini)}</span></div><button class="btn sm" data-a="ajuste" data-c="${esc(k.nome)}">Ajustar</button></div>`).join('') || '<div class="empty">Sem contas.</div>'}</div>
  <div class="sec"><h2>Conexão</h2></div>
  <div class="card">
   <div class="f"><label>Link do Apps Script (termina em /exec)</label><input id="cu" value="${esc(c.url)}" placeholder="https://script.google.com/macros/s/.../exec" autocapitalize="off" autocomplete="off"></div>
   <div class="f"><label>Chave (CHAVE_API)</label><input id="cc" type="password" value="${esc(c.chave)}" autocomplete="off"></div>
   <div style="display:flex;gap:8px"><button class="btn pri" style="flex:1" data-a="salvarcfg">Salvar e testar</button><button class="btn" data-a="resync">Recarregar</button></div>
   <div class="hint" style="margin:14px 0 0">O widget da tela inicial usa esse mesmo link e chave. Para adicionar: segure um espaço vazio da tela inicial, escolha Widgets e depois Financeiro.</div></div>`;
}
function render() {
  const t = S.tab, main = $('#main'), keep = main.scrollTop, qv = $('#qt') ? $('#qt').value : '';
  main.innerHTML = t === 'home' ? telaHome() : t === 'prev' ? telaPrev() : t === 'mes' ? telaMes() : telaMais();
  if ($('#qt')) $('#qt').value = qv;
  main.scrollTop = keep;
  $('#dock').innerHTML = `<nav>${[['home', 'home', 'Início'], ['prev', 'cal', 'Previstos'], ['mes', 'chart', 'Mês'], ['mais', 'sliders', 'Ajustes']]
    .map(([k, i, n]) => `<button class="${t === k ? 'on' : ''}" data-a="tab" data-t="${k}" aria-label="${n}">${ic(i)}</button>`).join('')}</nav>
    <button class="fab" data-a="novo" data-p="${t === 'prev' ? '1' : ''}" aria-label="Novo lançamento">${ic('plus')}</button>`;
}

/* ============ folhas (formulários) ============ */
function folha(html) { fechar(); const d = document.createElement('div'); d.className = 'sheetbg'; d.id = 'sheet'; d.innerHTML = `<div class="sheet">${html}</div>`; d.addEventListener('click', e => { if (e.target === d) fechar(); }); $('#layer').appendChild(d); return d; }
function fechar() { const s = $('#sheet'); if (s) s.remove(); }
const opts = (arr, sel) => arr.map(v => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');
let form = {};
function abrirNovo(prev, scan) {
  form = {tipo: 'S', url: ''};
  const cs = S.carteiras.map(c => c.nome);
  folha(`<h3>${prev ? 'Novo previsto' : 'Novo lançamento'}</h3>
  <div class="seg" id="sg"><button class="on" data-v="S">Saída</button><button data-v="E">Entrada</button><button data-v="T">Transferir</button></div>
  <div class="f"><label>Valor</label><input id="fv" inputmode="decimal" placeholder="0,00" style="font-size:28px;font-weight:600;padding:16px 18px"></div>
  <div class="f"><label>Descrição</label><input id="fd" placeholder="mercado, salário, uber…" autocomplete="off"></div>
  <div class="two"><div class="f"><label id="lc">Conta</label><select id="fc">${opts(cs, cs[0])}</select></div>
   <div class="f" id="gd" style="display:none"><label>Para a conta</label><select id="fdst">${opts(cs, cs[1] || cs[0])}</select></div>
   <div class="f" id="gcat"><label>Categoria</label><select id="fcat"><option value="">Automática</option>${opts(CATS)}</select></div></div>
  <div class="two"><div class="f"><label>${prev ? 'Data prevista' : 'Data'}</label><input id="fdt" type="date" value="${isoHoje()}"></div>
   <div class="f" id="gn"><label>Parcelas</label><input id="fn" inputmode="numeric" placeholder="1"></div></div>
  <div class="f" id="gcomp"><label>Comprovante (foto, print ou PDF)</label><label class="btn full" style="margin:0;justify-content:flex-start;padding:15px 18px">${ic('scan')} Escolher foto ou arquivo<input id="ff" type="file" accept="image/*,application/pdf" style="display:none"></label><div class="hint" id="fh" style="margin:8px 6px 0">Eu leio o valor e preencho para você.</div></div>
  <label class="chk"><input id="fp" type="checkbox" ${prev ? 'checked' : ''}> Ainda vai acontecer (previsto, não mexe no saldo)</label>
  <div style="display:flex;gap:10px"><button class="btn" data-a="fechar">Cancelar</button><button class="btn pri" style="flex:1" data-a="salvarnovo">Salvar</button></div>`);
  $('#sg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; form.tipo = b.dataset.v;
    $('#sg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    const T = form.tipo === 'T'; $('#gd').style.display = T ? '' : 'none'; $('#gcat').style.display = T ? 'none' : ''; $('#gn').style.display = form.tipo === 'S' ? '' : 'none';
    $('#lc').textContent = T ? 'Da conta' : 'Conta'; $('#gcomp').style.display = T ? 'none' : ''; });
  $('#ff').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f) return; $('#fh').textContent = 'Lendo o comprovante…';
    try { const r = await enviarArquivo(f); form.url = r.url;
      if (r.leitura) { const d = r.leitura; $('#fv').value = String(d.valor).replace('.', ','); if (d.desc && !$('#fd').value) $('#fd').value = d.desc; $('#fdt').value = d.data;
        form.tipo = d.tipo; $('#sg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.v === d.tipo)); $('#gn').style.display = d.tipo === 'S' ? '' : 'none';
        $('#fh').textContent = 'Li ' + (d.tipo === 'E' ? 'uma entrada' : 'uma saída') + ' de ' + brl(d.valor) + (d.incerto ? ' (confira se é entrada ou saída)' : '') + '. Confira e salve.'; }
      else $('#fh').textContent = 'Comprovante salvo no Drive, mas não consegui ler o valor. Preencha à mão.';
    } catch (er) { $('#fh').textContent = er.message; } });
  if (scan) setTimeout(() => $('#ff') && $('#ff').click(), 120);
}
async function salvarNovo() {
  const v = num($('#fv').value); if (!(v > 0)) return aviso('Digite um valor maior que zero.', 'bad');
  const tipo = form.tipo, cart = $('#fc').value, desc = $('#fd').value.trim(), data = $('#fdt').value || isoHoje();
  const op = {op: 'add', id: uid(), tipo, valor: v, carteira: cart, data};
  if (tipo === 'T') { op.destino = $('#fdst').value; if (op.destino === cart) return aviso('Escolha contas diferentes.', 'bad'); op.categoria = 'Transferência'; op.descricao = 'Transf.'; }
  else { op.descricao = desc; op.categoria = $('#fcat').value || adivinha(desc, tipo); if (tipo === 'S') op.n = parseInt($('#fn').value) || 1; if (form.url) op.comprovante = form.url; if ($('#fp').checked) { op.previsto = 1; op.n = 1; } }
  fechar(); await fazer([op], 'Lançado');
}
function reduzir(file) {
  return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 1500 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg', .82).split(',')[1]); };
    img.onerror = () => rej(new Error('Não consegui abrir essa imagem.')); img.src = u; });
}
async function enviarArquivo(f) {
  let b64, mime = 'image/jpeg';
  if (f.type === 'application/pdf') { mime = f.type; b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); }); }
  else b64 = await reduzir(f);
  return api({acao: 'comp', b64, mime});
}
function abrirDet(id) {
  const r = S.linhas[id]; if (!r) return;
  const cs = S.carteiras.map(c => c.nome);
  folha(`<h3 style="display:flex;align-items:center;gap:12px">${icone(r)}<span>${brl(r.valor)}</span>${r.prev ? '<span class="badge">previsto</span>' : ''}</h3>
  <div class="two"><div class="f"><label>Valor</label><input id="ev" inputmode="decimal" value="${String(r.valor).replace('.', ',')}"></div><div class="f"><label>Data</label><input id="et" type="date" value="${esc(r.data)}"></div></div>
  <div class="f"><label>Descrição</label><input id="ed" value="${esc(r.desc)}"></div>
  <div class="two"><div class="f"><label>Categoria</label><select id="ec">${opts(Array.from(new Set(CATS.concat([r.cat, 'Receita', 'Ajuste', 'Transferência']))), r.cat)}</select></div>
   <div class="f"><label>Conta</label><select id="ew">${opts(cs, r.cart)}</select></div></div>
  <label class="chk" style="margin-top:0"><input id="ep" type="checkbox" ${r.prev ? 'checked' : ''}> Ainda vai acontecer (previsto, não mexe no saldo)</label>
  ${r.grupo ? `<div class="hint" style="margin-top:0">Parcela ${r.n}/${r.total}. A edição vale só para esta parcela.</div>` : ''}
  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">${r.comp ? `<a class="btn" href="${esc(r.comp)}" target="_blank" rel="noopener">${ic('clip')} Ver comprovante</a>` : ''}
   <label class="btn" style="margin:0">${ic('scan')} ${r.comp ? 'Trocar' : 'Anexar'} comprovante<input id="ea" type="file" accept="image/*,application/pdf" style="display:none"></label></div>
  <div style="display:flex;gap:10px"><button class="btn no" data-a="apagar" data-id="${esc(id)}" aria-label="Apagar">${ic('trash')}</button><button class="btn pri" style="flex:1" data-a="salvaredit" data-id="${esc(id)}">Salvar</button></div>`);
  $('#ea').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; aviso('Enviando comprovante…');
    try { const x = await enviarArquivo(f); fechar(); await fazer([{op: 'anexar', id, url: x.url}], 'Comprovante anexado'); } catch (er) { aviso(er.message, 'bad'); } });
}
function abrirAjuste(c) {
  const x = saldos();
  folha(`<h3>Acertar saldo</h3><div class="hint" style="margin-top:-6px">${esc(c)}: o app calcula <b style="color:#fff">${brl(x.s[c] || 0)}</b>. Digite quanto tem de verdade e eu lanço só a diferença (fica como “Ajuste”, fora das receitas e gastos).</div>
  <div class="f"><label>Saldo real agora</label><input id="ar" inputmode="decimal" placeholder="0,00" style="font-size:28px;font-weight:600;padding:16px 18px"></div>
  <div style="display:flex;gap:10px"><button class="btn" data-a="fechar">Cancelar</button><button class="btn pri" style="flex:1" data-a="okajuste" data-c="${esc(c)}">Ajustar</button></div>`);
  setTimeout(() => $('#ar') && $('#ar').focus(), 80);
}
function abrirReceber(id) {
  const r = S.linhas[id]; if (!r) return;
  folha(`<h3>${r.tipo === 'E' ? 'Recebi' : 'Paguei'}: ${esc(r.desc || r.cat)}</h3><div class="hint" style="margin-top:-6px">${r.prev ? 'Previsto' : 'Agendado'} ${brl(r.valor)} para ${dt(r.data)}. Se veio diferente, corrija o valor.</div>
  <div class="f"><label>Valor real</label><input id="rv" inputmode="decimal" value="${String(r.valor).replace('.', ',')}" style="font-size:28px;font-weight:600;padding:16px 18px"></div>
  <div style="display:flex;gap:10px"><button class="btn no" data-a="apagar" data-id="${esc(id)}" aria-label="Excluir previsto">${ic('trash')}</button><button class="btn pri" style="flex:1" data-a="okreceber" data-id="${esc(id)}">Confirmar hoje</button></div>`);
}
function abrirOrc() {
  const o = {}; S.orc.forEach(x => o[x.categoria] = x.limite);
  folha(`<h3>Orçamento mensal</h3><div class="hint" style="margin-top:-6px">Limite por categoria. Deixe em branco para não ter limite.</div>
  ${CATS.map(c => `<div class="f" style="display:flex;gap:12px;align-items:center"><div class="ico" style="width:40px;height:40px;font-size:18px;color:${CATV[c][1]}">${ic(CATV[c][0])}</div><label style="margin:0;flex:1;font-size:15px;color:#fff">${c}</label><input data-oc="${c}" inputmode="decimal" value="${o[c] ? String(o[c]).replace('.', ',') : ''}" placeholder="sem limite" style="width:140px"></div>`).join('')}
  <div style="display:flex;gap:10px;margin-top:8px"><button class="btn" data-a="fechar">Cancelar</button><button class="btn pri" style="flex:1" data-a="okorc">Salvar</button></div>`);
}

/* ============ ações ============ */
async function acao(a, el) {
  const d = el.dataset;
  if (a === 'tab') { S.tab = d.t; render(); $('#main').scrollTop = 0; }
  else if (a === 'todos') { S.todos = !S.todos; render(); }
  else if (a === 'mm') { const [y, m] = S.mes.split('-').map(Number), n = new Date(y, m - 1 + Number(d.d), 1); S.mes = n.getFullYear() + '-' + pad(n.getMonth() + 1); render(); }
  else if (a === 'mv') { S.mview = d.v; render(); }
  else if (a === 'pf') { S.pf = (S.tab === 'prev' && S.pf === d.f) ? '' : d.f; S.tab = 'prev'; render(); $('#main').scrollTop = 0; }
  else if (a === 'novo') abrirNovo(!!d.p, !!d.s);
  else if (a === 'fechar') fechar();
  else if (a === 'salvarnovo') await salvarNovo();
  else if (a === 'det') abrirDet(d.id);
  else if (a === 'ajuste') abrirAjuste(d.c);
  else if (a === 'receber') abrirReceber(d.id);
  else if (a === 'orc') abrirOrc();
  else if (a === 'novacart') {
    folha(`<h3>Nova conta</h3><div class="f"><label>Nome</label><input id="cn" placeholder="Cartão, Poupança…"></div><div class="f"><label>Saldo inicial</label><input id="ci" inputmode="decimal" placeholder="0,00"></div>
    <div style="display:flex;gap:10px"><button class="btn" data-a="fechar">Cancelar</button><button class="btn pri" style="flex:1" data-a="oknovacart">Criar</button></div>`);
  }
  else if (a === 'oknovacart') { const n = $('#cn').value.trim(); if (!n) return aviso('Dê um nome.', 'bad'); const i = num($('#ci').value || '0') || 0; fechar(); await fazer([{op: 'carteira', nome: n, ini: i}], 'Conta criada'); }
  else if (a === 'okajuste') {
    const real = num($('#ar').value); if (real === null) return aviso('Digite o saldo real.', 'bad');
    const c = d.c, dif = Math.round((real - (saldos().s[c] || 0)) * 100) / 100;
    if (dif === 0) { fechar(); return aviso('Já está certo', 'good'); }
    fechar(); await fazer([{op: 'add', id: uid(), tipo: dif > 0 ? 'E' : 'S', valor: Math.abs(dif), carteira: c, categoria: 'Ajuste', descricao: 'Ajuste de saldo'}], 'Ajuste de ' + (dif > 0 ? '+' : '−') + brl(Math.abs(dif)));
  }
  else if (a === 'okreceber') { const v = num($('#rv').value); const r0 = S.linhas[d.id]; fechar(); await fazer([r0 && !r0.prev ? {op: 'edit', id: d.id, data: isoHoje(), valor: v > 0 ? v : undefined} : {op: 'receber', id: d.id, valor: v > 0 ? v : undefined}], 'Confirmado'); }
  else if (a === 'salvaredit') {
    const v = num($('#ev').value); if (!(v > 0)) return aviso('Valor inválido.', 'bad');
    const op = {op: 'edit', id: d.id, valor: v, data: $('#et').value, descricao: $('#ed').value.trim(), categoria: $('#ec').value, carteira: $('#ew').value}, r0 = S.linhas[d.id];
    if (r0 && $('#ep').checked !== r0.prev) op.previsto = $('#ep').checked ? 1 : 0;
    fechar(); await fazer([op], 'Atualizado');
  }
  else if (a === 'apagar') { fechar(); await fazer([{op: 'del', id: d.id}], 'Apagado'); }
  else if (a === 'okorc') {
    const ops = []; document.querySelectorAll('[data-oc]').forEach(i => { const v = num(i.value || '0') || 0; ops.push({op: 'orc', categoria: i.dataset.oc, limite: v}); });
    fechar(); await fazer(ops, 'Orçamentos salvos');
  }
  else if (a === 'adiantar') { const x = parcelas().find(p => p.k === d.k); if (x) await fazer([{op: 'adiantar', descricao: x.d, qtd: 1}], 'Parcela adiantada'); }
  else if (a === 'qenviar') await enviarQuick();
  else if (a === 'resync') { try { await sync(true); reaplicar(); aviso('Tudo recarregado', 'good'); } catch (e) { aviso(e.message, 'bad'); } render(); }
  else if (a === 'salvarcfg') {
    S.cfg.url = $('#cu').value.trim(); S.cfg.chave = $('#cc').value.trim(); await salvarCfg();
    try { const r = await api({acao: 'resumo'}); aviso('Conectado. Total ' + brl(r.total), 'good'); await sync(true); } catch (e) { aviso(e.message, 'bad'); }
    render();
  }
}
async function enviarQuick() {
  const i = $('#qt'), t = i.value.trim(); if (!t) return;
  const it = {k: 'texto', id: uid(), texto: t};
  if (!aplicarTexto(it)) return aviso('Não entendi. Exemplo: 25 mercado', 'bad');
  S.fila.push(it); salvarLocal(); i.value = '';
  const l = S.linhas[it.id] || S.linhas[it.id + '-0'];
  aviso(l ? (l.tipo === 'E' ? 'Entrada ' : l.tipo === 'T' ? 'Transferência ' : 'Saída ') + brl(l.valor) + ' • ' + (l.desc || l.cat) : 'Lançado', 'good');
  render(); const q = $('#qt'); if (q) q.focus(); agendar();
}
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el || el.tagName === 'INPUT') return; acao(el.dataset.a, el); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'qt') { e.preventDefault(); enviarQuick(); } if (e.key === 'Enter' && e.target.id === 'ar') { const b = document.querySelector('[data-a=okajuste]'); if (b) b.click(); } });
window.addEventListener('online', () => enviar());
document.addEventListener('visibilitychange', () => { if (!document.hidden) enviar(); });
setInterval(() => { if (!document.hidden) enviar(); }, 60000);

/* ============ início ============ */
carregarLocal(); render();
if (!S.cfg.url) { S.tab = 'mais'; render(); aviso('Primeiro configure o link e a chave.', ''); }
else { reaplicar(); render(); enviar(); }
</script>
