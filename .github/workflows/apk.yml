name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o app (www) para o Android
        run: npx cap sync android

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Guardar o APK (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: financeiro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar em Releases (link fixo para baixar no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Financeiro.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Financeiro.apk --title "Financeiro (APK mais recente)" --notes "Baixe o Financeiro.apk, abra e instale. Commit: ${{ github.sha }}"
