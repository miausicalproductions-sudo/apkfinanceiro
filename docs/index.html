<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fdf2f8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Financeiro">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest">
<title>Financeiro</title>
<style>
@font-face{font-family:'Inter Tight';src:url('fonts/InterTight.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--bg:#fdf2f8;--card:#ffffff;--card2:#f6edfd;--line:#f4e4f0;--line2:#e9d8f4;--tx:#4b3560;--mut:#9a86ad;--dim:#c5b6d4;--on:#ffffff;--lima:#ee7ab8;--lima2:#c9a6f5;--verm:#ef6a85;--azul:#9b8cf0;--r:28px;
--top:calc(max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px)) + 12px);
--bot:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:500 15px/1.35 'Inter Tight',system-ui,-apple-system,Roboto,sans-serif;letter-spacing:-.01em}
body{overflow:hidden}
#app{height:100%}
main{height:100%;overflow-y:auto;padding:var(--top) 14px calc(var(--bot) + 110px);-webkit-overflow-scrolling:touch}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.14em}
svg.i.fill{fill:currentColor;stroke:none}
.title{font-size:30px;line-height:1.08;font-weight:600;letter-spacing:-.035em;margin:18px 6px 18px}
.title span{color:var(--mut)}
.lbl{font-size:13px;color:var(--mut);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.big{font-size:32px;font-weight:600;letter-spacing:-.035em;line-height:1.05}
.mut{color:var(--mut)}.lima{color:var(--lima)}.verm{color:var(--verm)}
/* hero com degradê */
.hero{position:relative;border-radius:0 0 34px 34px;margin:calc(-1 * var(--top)) -14px 14px;padding:calc(var(--top) + 6px) 20px 24px;min-height:250px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
background:radial-gradient(120% 90% at 90% 0%,#ffc4e1 0%,rgba(255,196,225,0) 60%),radial-gradient(90% 80% at 0% 10%,#d4c1ff 0%,rgba(212,193,255,0) 62%),radial-gradient(100% 70% at 50% 100%,#ffe0ef 0%,rgba(255,224,239,0) 70%),#f6e9ff;color:var(--tx)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 55%,rgba(253,242,248,.55));pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .row1{display:flex;justify-content:space-between;align-items:center}
.logo{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.55);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:20px;color:var(--lima)}
.pilha{display:flex;align-items:center;background:rgba(255,255,255,.55);backdrop-filter:blur(8px);border-radius:999px;padding:5px 10px 5px 6px}
.pilha .b{margin-right:-9px}
.pilha .dot{width:7px;height:7px;border-radius:50%;margin-left:16px;background:var(--lima)}
.pilha .dot.off{background:#ff9a3d}
.hero .big{font-size:42px}
.hero .lbl{color:rgba(255,255,255,.75)}
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--line2);background:rgba(255,255,255,.75);color:var(--tx);border-radius:999px;padding:9px 16px;font:inherit;font-weight:500;font-size:14px;white-space:nowrap}
.pill.on{background:var(--tx);color:#fff;border-color:var(--tx)}
/* banco (círculo colorido) */
.b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--tx);font-size:17px;border:2px solid #fff;flex:none}
.b.g{width:44px;height:44px;font-size:21px;border:0}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.mini .v{font-size:20px;font-weight:600;letter-spacing:-.03em;margin-top:2px}
.mini .s{font-size:12px;color:var(--mut)}
.tap:active{opacity:.6}
.mini .s svg{vertical-align:-.2em;color:var(--dim)}
.mini .cab{display:flex;align-items:center;justify-content:space-between;min-height:34px}
.cab .ch{color:var(--dim);font-size:16px}
.segbar{display:flex;gap:4px;height:6px;margin:14px 0 18px}
.segbar i{display:block;border-radius:9px;min-width:6px}
.mbar{display:flex;gap:5px;align-items:center;flex:1;margin-right:12px}
.mbar i{display:block;height:9px;border-radius:9px}
/* mapa de pontos */
.heat{display:grid;gap:6px;margin-top:14px}
.heat i{aspect-ratio:1;border-radius:5px;background:#f4e4f0;display:block}
.heat i.l1{background:#fbd3e8}.heat i.l2{background:#e9a6cf}.heat i.l3{background:#c9a6f5}.heat i.l4{background:#ee7ab8}
/* campo rápido */
.quick{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 20px;margin-bottom:12px}
.quick input{border:0;background:none;padding:11px 0;border-radius:0;flex:1;min-width:0}
.quick .go{width:42px;height:42px;border-radius:50%;border:0;background:var(--lima);color:var(--on);font-size:19px;display:grid;place-items:center}
.quick .scan{background:none;border:0;color:var(--lima);font-size:23px;width:40px;height:40px;display:grid;place-items:center}
input,select{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line2);border-radius:18px;padding:14px 16px;font:inherit;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--lima)}
input::placeholder{color:var(--dim)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#777 50%),linear-gradient(135deg,#777 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
.btn{border:0;border-radius:999px;padding:14px 20px;font:inherit;font-weight:600;background:var(--card2);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active,.pill:active,.row:active{opacity:.65}
.btn.pri{background:var(--lima);color:var(--on)}.btn.bco{background:var(--tx);color:#fff}.btn.no{background:#fde4ea;color:var(--verm)}
.btn.sm{padding:8px 14px;font-size:13px}.btn.full{width:100%}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 6px 10px}
.sec h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.03em}
/* linhas */
.row{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#f6edfd;flex:none;font-size:21px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.row .t span{font-size:12.5px;color:var(--mut)}
.row .v{font-weight:600;white-space:nowrap;font-size:16px}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.badge{background:var(--lima);color:var(--on);border-radius:999px;font-size:11px;font-weight:700;padding:3px 9px}
/* barras do mês */
.pares{display:flex;gap:6px;align-items:flex-end;justify-content:space-around;height:170px;margin:18px 0 6px}
.par{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;opacity:.45}
.par.on{opacity:1}
.par .bb{display:flex;gap:4px;align-items:flex-end;height:140px}
.par .bb i{display:block;width:14px;border-radius:9px;min-height:6px}
.par .e{background:linear-gradient(180deg,#bff0a8,#7fd69a)}.par .d{background:linear-gradient(180deg,#ff9bb0,#f27a93)}
.par small{color:var(--mut);font-size:12px;text-transform:lowercase}
.proj{width:100%;height:auto;display:block;margin-top:14px;overflow:visible}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:2px 2px 8px}
.leg{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:15px}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.prog{height:6px;background:#f0e3f6;border-radius:9px;overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;border-radius:9px;background:var(--lima)}
.prog i.over{background:var(--verm)}
/* navegação flutuante */
.dock{position:fixed;left:14px;right:14px;bottom:calc(var(--bot) + 14px);display:flex;gap:10px;align-items:center;z-index:10}
.dock nav{flex:1;display:flex;background:rgba(255,255,255,.88);border:1px solid var(--line2);border-radius:999px;padding:6px;backdrop-filter:blur(14px)}
.dock nav button{flex:1;border:0;background:none;color:var(--mut);height:50px;border-radius:999px;font-size:24px;display:grid;place-items:center}
.dock nav button.on{background:#fde4f2;color:var(--lima)}
.fab{width:62px;height:62px;border-radius:50%;border:0;background:var(--lima);color:var(--on);font-size:28px;display:grid;place-items:center;box-shadow:0 10px 30px rgba(238,122,184,.30)}
/* folhas */
.sheetbg{position:fixed;inset:0;background:rgba(75,53,96,.35);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:93%;overflow-y:auto;overscroll-behavior:contain;background:#fffafd;border-radius:32px 32px 0 0;border:1px solid var(--line2);border-bottom:0;padding:10px 18px calc(var(--bot) + 20px)}
.sheet:before{content:"";display:block;width:42px;height:4px;border-radius:9px;background:#333;margin:0 auto 16px}
.sheet h3{margin:0 0 16px;font-size:24px;font-weight:600;letter-spacing:-.03em}
.f{margin-bottom:12px}.f label{display:block;font-size:12.5px;color:var(--mut);margin:0 0 6px 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card2);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:11px 0;border-radius:999px}
.seg button.on{background:var(--tx);color:#fff}
.hint{font-size:12.5px;color:var(--mut);margin:6px 6px 14px}
.chk{display:flex;gap:10px;align-items:center;color:var(--mut);margin:6px 6px 16px;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--lima);padding:0}
.toast{position:fixed;left:14px;right:14px;top:var(--top);z-index:40;background:#ffffff;border:1px solid var(--line2);border-radius:22px;padding:14px 18px;box-shadow:0 14px 40px rgba(150,100,190,.25);animation:in .2s;display:flex;gap:10px;align-items:center}
.toast.good{border-color:#fbd3e8}.toast.good svg{color:var(--lima)}.toast.bad{border-color:#f7b6c4}.toast.bad svg{color:var(--verm)}
@keyframes in{from{transform:translateY(-12px);opacity:0}}
a{color:var(--lima)}
.ico.pic{position:relative;overflow:hidden}
.ico.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:3px;border-radius:50%}
.prod{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line2);border-radius:20px;padding:10px 12px;margin:-4px 0 12px}
.prod .ico{width:52px;height:52px}
.prod .t{flex:1;min-width:0;font-size:13px;color:var(--mut)}
.prod .t b{display:block;color:var(--tx);font-weight:600;font-size:14px}
.aviso{display:flex;gap:10px;align-items:center}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:#fde4ea;color:var(--verm);margin-left:6px}
.tag.hj{background:#fbd3e8;color:var(--lima)}.tag.am{background:#efe4f8;color:var(--tx)}
.qbar{display:flex;gap:4px;height:16px;margin:14px 0 14px}.qbar i{border-radius:9px;min-width:6px;transition:flex .3s}.qbar i.eu,.qlado.eu i{background:var(--lima)}.qbar i.pai,.qlado.pai i{background:var(--azul)}
.qdois{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qlado{border-radius:22px;padding:12px 14px;background:var(--card2)}.qlado.eu{border:1.5px solid var(--lima)}.qlado.pai{border:1.5px solid var(--azul)}
.qlado .qn{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut)}.qlado .qn i{width:10px;height:10px;border-radius:50%;display:block}.qlado .qv{font-size:21px;font-weight:600;letter-spacing:-.03em;margin:4px 0 2px}.qlado .qs{font-size:12px;color:var(--mut)}
.qtag{font-style:normal;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;margin-right:6px;color:white}.qtag.eu{background:var(--lima)}.qtag.pai{background:var(--azul)}
.chipsw{border:0;border-radius:999px;padding:7px 12px;font:inherit;font-weight:600;font-size:12.5px;background:rgba(255,255,255,.14);color:var(--tx);backdrop-filter:blur(8px)}.chipsw.emp{background:var(--azul);color:var(--tx)}
.dist .f label{font-size:13px}.dist select,.dist input{font-size:15px}.stt{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}.stt.ok{background:var(--lima);color:var(--on)}.stt.er{background:var(--verm);color:white}
.pbub{position:fixed;right:14px;top:calc(var(--top) + 7px);z-index:12;width:40px;height:40px;border-radius:50%;border:2px solid var(--bg);background:var(--lima);color:var(--on);font:700 17px/1 inherit;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28);touch-action:manipulation;user-select:none;-webkit-user-select:none}.pbub.emp{background:var(--azul);color:white}
.pmenu{position:fixed;right:14px;top:calc(var(--top) + 54px);z-index:30;background:var(--card2);border:1px solid var(--line2);border-radius:22px;padding:6px;box-shadow:0 14px 40px rgba(255,255,255,.55);min-width:170px}.pmenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--tx);font:inherit;font-weight:600;padding:12px 14px;border-radius:16px}.pmenu button.on{background:var(--card)}.pmenu i{width:28px;height:28px;border-radius:50%;display:block;flex:none}
.tem-bub .hero .pilha{margin-right:50px}
.pbub{perspective:600px}.pbub.flip{animation:pflip .55s ease}@keyframes pflip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(90deg) scale(1.3)}100%{transform:rotateY(0) scale(1)}}
.pbub.sync:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid transparent;border-top-color:var(--tx);border-right-color:var(--tx);animation:pspin .8s linear infinite}@keyframes pspin{to{transform:rotate(360deg)}}
.pveil{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.97;clip-path:circle(0 at calc(100% - 34px) calc(var(--top) + 27px));transition:clip-path .38s cubic-bezier(.2,.7,.2,1),opacity .3s;display:grid;place-items:center}
.pveil.go{clip-path:circle(160% at calc(100% - 34px) calc(var(--top) + 27px))}.pveil.out{opacity:0}
.pvl{display:flex;flex-direction:column;align-items:center;gap:12px;color:white;font-size:26px;font-weight:700;letter-spacing:-.03em}.pva{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.3);background-size:cover;background-position:center;border:3px solid rgba(255,255,255,.8)}
@media (prefers-reduced-motion:reduce){.pbub.flip,.pbub.sync:after{animation:none}}
.fileoc{position:relative;overflow:hidden}.fileoc input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:100px;cursor:pointer}
.toast .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line2);border-top-color:var(--lima);display:block;flex:none;animation:pspin .8s linear infinite}
.lnk{background:none;border:0;padding:0;color:var(--lima);font:inherit;text-decoration:underline;cursor:pointer}

/* ===== tema pastel (versão iPhone) ===== */
body{background:var(--bg)}
.card,.mini{box-shadow:0 6px 22px rgba(190,140,220,.14);border-color:var(--line)}
.btn.pri,.fab,.quick .go,.badge{background:linear-gradient(135deg,#f58fc6,#b99af2);color:#fff}
.fab{box-shadow:0 10px 26px rgba(185,154,242,.45)}
.btn.bco{background:var(--card2);color:var(--tx)}
.btn.no{background:#fde4ea;color:var(--verm)}
.hero .lbl{color:var(--mut)}
.title span{color:var(--lima)}
.sheet{box-shadow:0 -10px 40px rgba(150,100,190,.25)}
.dock nav{box-shadow:0 8px 26px rgba(190,140,220,.22)}
input,select,textarea{background:#fff;color:var(--tx);border-color:var(--line2)}
input::placeholder{color:var(--dim)}
.toast{box-shadow:0 14px 40px rgba(150,100,190,.3)}
</style>
</head>

<symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
<symbol id="i-bill" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></symbol>
<symbol id="i-dots" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="18" cy="12" r="1.3" fill="currentColor"/></symbol>

}

    lendoComp = true; const r = await A.pegarCompartilhado(); if (!r || !r.b64) return;

    const bin = atob(r.b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const pdf = r.mime === 'application/pdf', f = new File([u8], pdf ? 'comprovante.pdf' : 'comprovante.jpg', {type: pdf ? 'application/pdf' : (r.mime || 'image/jpeg')});

}
